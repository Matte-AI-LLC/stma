# Continuous integration: the "tests before deploy" rule, enforced.
# Runs the exact commands the repo rules require: typecheck + e2e suite + build.
# The e2e suite uses an embedded PGlite database — no external services needed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS/Windows live in the nightly/manual cross-platform workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: hashFiles('ee/package-lock.json') != ''
        run: npm ci --prefix ee
      - run: npm run typecheck
      - if: hashFiles('ee/package-lock.json') != ''
        run: npm run typecheck --prefix ee
      - run: npm test
      - run: npm run human-lab:check
      - run: npm run machine-lab:check
      # The ledger hygiene rule asks whether each tier's newest pass is an ancestor of HEAD,
      # which a one-commit checkout cannot answer (the test skips itself there). Fetch the
      # history so it runs here instead of only on somebody's full clone.
      - if: hashFiles('acceptance/owed.test.mjs') != ''
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --no-tags --unshallow origin; fi
      # The private acceptance map: which change owes a two-device round, and that the
      # real-agent lab still loads and still types the guide's own sentences.
      - if: hashFiles('acceptance/owed.test.mjs') != ''
        run: node --test acceptance/owed.test.mjs acceptance/agent-lab/lab.test.mjs
      # Pure configuration, evidence and verdict checks only; never call a model in CI.
      - if: hashFiles('acceptance/agent-worker/api-support.test.ts') != ''
        run: |
          npx tsc -p acceptance/agent-worker/tsconfig.json
          npx tsx --test acceptance/agent-worker/api-support.test.ts
      # The public mirror's allowlist and scan, on every change rather than first
      # at the tag: v0.19.1's mirror was refused for one test comment after npm and
      # production had already shipped. The script is not in the public tree, so
      # the public repository skips this step.
      - if: hashFiles('scripts/public-tree.mjs') != ''
        run: node scripts/public-tree.mjs "$RUNNER_TEMP/public-tree"
      - if: hashFiles('ee/package-lock.json') != ''
        run: npm test --prefix ee
      - run: npm run build
      - if: hashFiles('ee/package-lock.json') != ''
        run: npm run build --prefix ee && npm run smoke:bundle --prefix ee
